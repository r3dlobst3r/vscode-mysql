<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline';">
    <title>Query Results</title>
    <style>
        :root {
            --cell-padding: 8px 12px;
            --border-color: var(--vscode-panel-border);
        }

        body {
            padding: 0;
            margin: 0;
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .toolbar {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--vscode-editor-background);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .toolbar-right {
            display: flex;
            gap: 8px;
        }

        .stats {
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
        }

        .stats-item {
            margin-right: 16px;
        }

        .stats-value {
            font-weight: 600;
            color: var(--vscode-foreground);
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 12px;
            background: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }

        button:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        button.primary {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }

        button.primary:hover {
            background: var(--vscode-button-hoverBackground);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            background: var(--vscode-editor-background);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--vscode-foreground);
            font-size: 13px;
            opacity: 0.7;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .tab:hover {
            opacity: 1;
        }

        .tab.active {
            opacity: 1;
            border-bottom-color: var(--vscode-focusBorder);
        }

        .tab.error {
            color: var(--vscode-errorForeground);
        }

        .content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .result-set {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .result-set.active {
            display: flex;
        }

        .table-container {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            position: sticky;
            top: 0;
            background: var(--vscode-editor-background);
            z-index: 10;
        }

        th {
            padding: var(--cell-padding);
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            font-weight: 600;
            white-space: nowrap;
            background: var(--vscode-editor-background);
        }

        th:hover {
            background: var(--vscode-list-hoverBackground);
        }

        td {
            padding: var(--cell-padding);
            border-bottom: 1px solid var(--border-color);
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: cell;
            user-select: none;
        }

        td.selected {
            background: var(--vscode-list-activeSelectionBackground) !important;
            color: var(--vscode-list-activeSelectionForeground);
        }

        tr:hover td:not(.selected) {
            background: var(--vscode-list-hoverBackground);
        }

        .null-value {
            color: var(--vscode-descriptionForeground);
            font-style: italic;
        }

        .error-message {
            padding: 20px;
            color: var(--vscode-errorForeground);
            background: var(--vscode-inputValidation-errorBackground);
            border: 1px solid var(--vscode-inputValidation-errorBorder);
            margin: 16px;
            border-radius: 4px;
        }

        .error-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .success-message {
            padding: 20px;
            color: var(--vscode-foreground);
            margin: 16px;
        }

        .success-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--vscode-testing-iconPassed);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--vscode-descriptionForeground);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--vscode-descriptionForeground);
        }

        .context-menu {
            position: fixed;
            background: var(--vscode-menu-background);
            border: 1px solid var(--vscode-menu-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 180px;
            padding: 4px 0;
            display: none;
        }

        .context-menu-item {
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-menu-item:hover {
            background: var(--vscode-menu-selectionBackground);
            color: var(--vscode-menu-selectionForeground);
        }

        .context-menu-separator {
            height: 1px;
            background: var(--vscode-menu-separatorBackground);
            margin: 4px 0;
        }

        .selection-info {
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
            padding: 4px 12px;
            background: var(--vscode-editor-background);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="stats" id="stats"></div>
            </div>
            <div class="toolbar-right">
                <button id="export-btn" title="Export current result set to CSV, JSON, Excel, or XML">Export</button>
                <button id="refresh-btn" class="primary" title="Re-run query">Refresh</button>
            </div>
        </div>

        <div class="tabs" id="tabs"></div>

        <div class="content" id="content">
            <div class="empty-state">
                <div class="empty-state-icon">📊</div>
                <div>No results to display</div>
            </div>
        </div>

        <div class="selection-info" id="selection-info" style="display: none;">
            <span id="selection-text"></span>
        </div>
    </div>

    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" data-action="copy">📋 Copy</div>
        <div class="context-menu-item" data-action="copy-csv">📄 Copy as CSV</div>
        <div class="context-menu-item" data-action="copy-json">{ } Copy as JSON</div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" data-action="select-all">⬜ Select All</div>
        <div class="context-menu-item" data-action="clear-selection">✖ Clear Selection</div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        let currentResults = [];
        let currentTab = 0;
        let selectedCells = new Set();
        let isSelecting = false;
        let selectionStart = null;

        // Handle messages from extension
        window.addEventListener('message', event => {
            const message = event.data;

            switch (message.command) {
                case 'showResults':
                    showResults(message.results);
                    break;
            }
        });

        function showResults(results) {
            currentResults = results;
            currentTab = 0;

            renderTabs();
            renderContent();
            updateStats();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs');
            tabsContainer.innerHTML = '';

            if (currentResults.length === 0) {
                return;
            }

            currentResults.forEach((result, index) => {
                const tab = document.createElement('button');
                tab.className = 'tab';
                if (index === currentTab) {
                    tab.classList.add('active');
                }
                if (result.error) {
                    tab.classList.add('error');
                }

                // Tab label
                if (result.error) {
                    tab.textContent = `Query ${index + 1} (Error)`;
                } else if (result.result && result.result.affectedRows !== undefined) {
                    tab.textContent = `Query ${index + 1} (${result.result.affectedRows} rows affected)`;
                } else if (result.result) {
                    tab.textContent = `Query ${index + 1} (${result.result.rowCount} rows)`;
                } else {
                    tab.textContent = `Query ${index + 1}`;
                }

                tab.addEventListener('click', () => {
                    currentTab = index;
                    renderTabs();
                    renderContent();
                    updateStats();
                });

                tabsContainer.appendChild(tab);
            });
        }

        function renderContent() {
            const contentContainer = document.getElementById('content');
            contentContainer.innerHTML = '';

            if (currentResults.length === 0) {
                contentContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div>No results to display</div>
                    </div>
                `;
                return;
            }

            const result = currentResults[currentTab];

            if (result.error) {
                contentContainer.innerHTML = `
                    <div class="error-message">
                        <div class="error-title">Query Error</div>
                        <pre>${escapeHtml(result.error)}</pre>
                    </div>
                `;
                return;
            }

            if (!result.result) {
                contentContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div>No data</div>
                    </div>
                `;
                return;
            }

            // Check if this is a non-SELECT query (INSERT, UPDATE, DELETE)
            if (result.result.affectedRows !== undefined && result.result.rows.length === 0) {
                contentContainer.innerHTML = `
                    <div class="success-message">
                        <div class="success-title">✓ Query executed successfully</div>
                        <div>${result.result.affectedRows} row(s) affected</div>
                    </div>
                `;
                return;
            }

            // Render data table
            const resultSet = document.createElement('div');
            resultSet.className = 'result-set active';

            const tableContainer = document.createElement('div');
            tableContainer.className = 'table-container';

            const table = createTable(result.result);
            tableContainer.appendChild(table);
            resultSet.appendChild(tableContainer);

            contentContainer.appendChild(resultSet);

            // Attach cell selection handlers
            attachCellSelectionHandlers(table);

            // Clear any previous selection
            clearSelection();
        }

        function createTable(queryResult) {
            const table = document.createElement('table');

            // Create header
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');

            queryResult.fields.forEach(field => {
                const th = document.createElement('th');
                th.textContent = field.name;
                th.title = `${field.name} (${field.type || 'unknown'})`;
                headerRow.appendChild(th);
            });

            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Create body
            const tbody = document.createElement('tbody');

            queryResult.rows.forEach(row => {
                const tr = document.createElement('tr');

                queryResult.fields.forEach(field => {
                    const td = document.createElement('td');
                    const value = row[field.name];

                    if (value === null) {
                        td.className = 'null-value';
                        td.textContent = 'NULL';
                    } else if (typeof value === 'object') {
                        td.textContent = JSON.stringify(value);
                    } else {
                        td.textContent = value;
                    }

                    td.title = td.textContent; // Show full value on hover
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            return table;
        }

        function updateStats() {
            const statsContainer = document.getElementById('stats');

            if (currentResults.length === 0) {
                statsContainer.innerHTML = '';
                return;
            }

            const result = currentResults[currentTab];
            let statsHtml = '';

            if (result.result && !result.error) {
                if (result.result.affectedRows !== undefined) {
                    statsHtml += `<span class="stats-item">Affected: <span class="stats-value">${result.result.affectedRows}</span></span>`;
                } else {
                    statsHtml += `<span class="stats-item">Rows: <span class="stats-value">${result.result.rowCount}</span></span>`;
                }
            }

            statsHtml += `<span class="stats-item">Time: <span class="stats-value">${result.executionTime}ms</span></span>`;

            statsContainer.innerHTML = statsHtml;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Cell selection functions
        function getCellKey(rowIndex, colIndex) {
            return `${rowIndex}-${colIndex}`;
        }

        function attachCellSelectionHandlers(table) {
            const tbody = table.querySelector('tbody');
            if (!tbody) return;

            const cells = tbody.querySelectorAll('td');

            cells.forEach((cell, index) => {
                const row = cell.parentElement;
                const rowIndex = Array.from(tbody.children).indexOf(row);
                const colIndex = Array.from(row.children).indexOf(cell);
                const cellKey = getCellKey(rowIndex, colIndex);

                cell.dataset.rowIndex = rowIndex;
                cell.dataset.colIndex = colIndex;
                cell.dataset.cellKey = cellKey;

                // Mouse down - start selection
                cell.addEventListener('mousedown', (e) => {
                    // Ignore right-clicks (button 2) - let contextmenu handle it
                    if (e.button === 2) {
                        return;
                    }

                    e.preventDefault();
                    isSelecting = true;
                    selectionStart = { rowIndex, colIndex };

                    if (!e.ctrlKey && !e.metaKey && !e.shiftKey) {
                        clearSelection();
                    }

                    if (e.shiftKey && selectedCells.size > 0) {
                        // Range selection
                        selectRange(selectionStart.rowIndex, selectionStart.colIndex, rowIndex, colIndex);
                    } else {
                        toggleCellSelection(cell, cellKey);
                    }

                    updateSelectionInfo();
                });

                // Mouse enter - extend selection
                cell.addEventListener('mouseenter', () => {
                    if (isSelecting && selectionStart) {
                        selectRange(selectionStart.rowIndex, selectionStart.colIndex, rowIndex, colIndex);
                        updateSelectionInfo();
                    }
                });

                // Right click - show context menu
                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();

                    // If this cell is not part of the current selection, select only this cell
                    // Otherwise, keep the current selection
                    if (!selectedCells.has(cellKey)) {
                        clearSelection();
                        selectedCells.add(cellKey);
                        cell.classList.add('selected');
                        updateSelectionInfo();
                    }

                    showContextMenu(e.clientX, e.clientY);
                });
            });
        }

        function toggleCellSelection(cell, cellKey) {
            if (selectedCells.has(cellKey)) {
                selectedCells.delete(cellKey);
                cell.classList.remove('selected');
            } else {
                selectedCells.add(cellKey);
                cell.classList.add('selected');
            }
        }

        function selectRange(startRow, startCol, endRow, endCol) {
            const minRow = Math.min(startRow, endRow);
            const maxRow = Math.max(startRow, endRow);
            const minCol = Math.min(startCol, endCol);
            const maxCol = Math.max(startCol, endCol);

            clearSelection();

            const table = document.querySelector('table');
            const tbody = table.querySelector('tbody');
            const rows = tbody.querySelectorAll('tr');

            for (let r = minRow; r <= maxRow; r++) {
                const row = rows[r];
                if (!row) continue;

                const cells = row.querySelectorAll('td');
                for (let c = minCol; c <= maxCol; c++) {
                    const cell = cells[c];
                    if (!cell) continue;

                    const cellKey = getCellKey(r, c);
                    selectedCells.add(cellKey);
                    cell.classList.add('selected');
                }
            }
        }

        function clearSelection() {
            selectedCells.clear();
            document.querySelectorAll('td.selected').forEach(cell => {
                cell.classList.remove('selected');
            });
            updateSelectionInfo();
        }

        function selectAll() {
            const table = document.querySelector('table');
            if (!table) return;

            const tbody = table.querySelector('tbody');
            const cells = tbody.querySelectorAll('td');

            clearSelection();
            cells.forEach(cell => {
                const cellKey = cell.dataset.cellKey;
                selectedCells.add(cellKey);
                cell.classList.add('selected');
            });

            updateSelectionInfo();
        }

        function updateSelectionInfo() {
            const infoElement = document.getElementById('selection-info');
            const textElement = document.getElementById('selection-text');

            if (selectedCells.size === 0) {
                infoElement.style.display = 'none';
            } else {
                infoElement.style.display = 'block';
                textElement.textContent = `${selectedCells.size} cell(s) selected`;
            }
        }

        function getSelectedData() {
            if (selectedCells.size === 0) return [];

            const table = document.querySelector('table');
            const tbody = table.querySelector('tbody');
            const result = currentResults[currentTab].result;

            const data = [];
            const sortedCells = Array.from(selectedCells).sort();

            sortedCells.forEach(cellKey => {
                const [rowIndex, colIndex] = cellKey.split('-').map(Number);
                const row = result.rows[rowIndex];
                const field = result.fields[colIndex];

                if (row && field) {
                    const value = row[field.name];
                    data.push({
                        rowIndex,
                        colIndex,
                        fieldName: field.name,
                        value: value === null ? 'NULL' : (typeof value === 'object' ? JSON.stringify(value) : String(value))
                    });
                }
            });

            return data;
        }

        function copyAsText() {
            const data = getSelectedData();
            if (data.length === 0) return;

            const text = data.map(d => d.value).join('\t');
            navigator.clipboard.writeText(text).then(() => {
                showCopyFeedback('Copied to clipboard');
            });
        }

        function copyAsCSV() {
            const data = getSelectedData();
            if (data.length === 0) return;

            // Group by rows
            const rows = new Map();
            data.forEach(d => {
                if (!rows.has(d.rowIndex)) {
                    rows.set(d.rowIndex, []);
                }
                rows.get(d.rowIndex).push(d);
            });

            // Get unique column names
            const columns = [...new Set(data.map(d => d.fieldName))];

            // Build CSV
            let csv = columns.join(',') + '\n';
            rows.forEach(rowData => {
                const values = columns.map(col => {
                    const cell = rowData.find(d => d.fieldName === col);
                    const value = cell ? cell.value : '';
                    // Escape quotes and wrap in quotes if contains comma or quote
                    if (value.includes(',') || value.includes('"') || value.includes('\n')) {
                        return '"' + value.replace(/"/g, '""') + '"';
                    }
                    return value;
                });
                csv += values.join(',') + '\n';
            });

            navigator.clipboard.writeText(csv).then(() => {
                showCopyFeedback('Copied as CSV');
            });
        }

        function copyAsJSON() {
            const data = getSelectedData();
            if (data.length === 0) return;

            // Group by rows
            const rows = new Map();
            data.forEach(d => {
                if (!rows.has(d.rowIndex)) {
                    rows.set(d.rowIndex, {});
                }
                let value = d.value;
                // Try to parse NULL and JSON values
                if (value === 'NULL') {
                    value = null;
                } else if (value.startsWith('{') || value.startsWith('[')) {
                    try {
                        value = JSON.parse(value);
                    } catch (e) {
                        // Keep as string
                    }
                }
                rows.get(d.rowIndex)[d.fieldName] = value;
            });

            const json = JSON.stringify(Array.from(rows.values()), null, 2);

            navigator.clipboard.writeText(json).then(() => {
                showCopyFeedback('Copied as JSON');
            });
        }

        function showCopyFeedback(message) {
            const selectionText = document.getElementById('selection-text');
            const originalText = selectionText.textContent;
            selectionText.textContent = `✓ ${message}`;
            setTimeout(() => {
                selectionText.textContent = originalText;
            }, 2000);
        }

        function showContextMenu(x, y) {
            const menu = document.getElementById('context-menu');
            menu.style.display = 'block';
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
        }

        function hideContextMenu() {
            document.getElementById('context-menu').style.display = 'none';
        }

        // Global mouse up - stop selection
        document.addEventListener('mouseup', () => {
            isSelecting = false;
        });

        // Click outside - hide context menu
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.context-menu')) {
                hideContextMenu();
            }
        });

        // Context menu handlers
        document.querySelectorAll('.context-menu-item').forEach(item => {
            item.addEventListener('click', () => {
                const action = item.dataset.action;
                hideContextMenu();

                switch (action) {
                    case 'copy':
                        copyAsText();
                        break;
                    case 'copy-csv':
                        copyAsCSV();
                        break;
                    case 'copy-json':
                        copyAsJSON();
                        break;
                    case 'select-all':
                        selectAll();
                        break;
                    case 'clear-selection':
                        clearSelection();
                        break;
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl+C / Cmd+C - Copy
            if ((e.ctrlKey || e.metaKey) && e.key === 'c' && selectedCells.size > 0) {
                e.preventDefault();
                copyAsText();
            }

            // Ctrl+A / Cmd+A - Select all
            if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                const table = document.querySelector('table');
                if (table && document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    selectAll();
                }
            }

            // Escape - Clear selection
            if (e.key === 'Escape') {
                clearSelection();
                hideContextMenu();
            }
        });

        // Button handlers
        document.getElementById('export-btn').addEventListener('click', () => {
            vscode.postMessage({ command: 'export', tabIndex: currentTab });
        });

        document.getElementById('refresh-btn').addEventListener('click', () => {
            vscode.postMessage({ command: 'refresh' });
        });

        // Request initial data
        vscode.postMessage({ command: 'ready' });
    </script>
</body>
</html>
