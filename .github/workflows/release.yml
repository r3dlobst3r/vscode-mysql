name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build VSIX (production)
      run: npm run vsce:package

    - name: Get version from package.json
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Get VSIX filename
      id: vsix-file
      run: echo "filename=$(ls *.vsix)" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.package-version.outputs.version }}
        name: MySQL Extension v${{ steps.package-version.outputs.version }}
        body: |
          ## MySQL Extension for VS Code

          Download and install the VSIX file below to add MySQL database management to Visual Studio Code.

          ### Installation
          1. Download `${{ steps.vsix-file.outputs.filename }}`
          2. Open VS Code
          3. Go to Extensions view (Ctrl+Shift+X / Cmd+Shift+X)
          4. Click the "..." menu → "Install from VSIX..."
          5. Select the downloaded file

          ### What's Changed
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
        files: |
          *.vsix
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
